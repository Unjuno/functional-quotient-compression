name: smollm2-structural-audit

on:
  pull_request:
    paths:
      - 'src/fqc/real_structural_audit.py'
      - 'scripts/run_smollm2_structural_audit.py'
      - 'tests/test_real_structural_audit.py'
      - 'experiments/transformer/T001_smollm2_135m/structural_audit_contract.json'
      - '.github/workflows/smollm2_structural_audit.yml'
  workflow_dispatch:

jobs:
  structural-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FQC
        run: python -m pip install -e .
      - name: Install pinned tensor runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'safetensors==0.4.5'
      - name: Download pinned SmolLM2 checkpoint
        run: |
          mkdir -p /tmp/fqc-smollm2
          curl -L --fail --retry 3 \
            -o /tmp/fqc-smollm2/model.safetensors \
            'https://huggingface.co/HuggingFaceTB/SmolLM2-135M/resolve/28e66ca6931668447a3bac213f23d990ad3b0e2b/model.safetensors?download=true'
      - name: Run task-unconditioned structural audit
        run: |
          python scripts/run_smollm2_structural_audit.py \
            --checkpoint /tmp/fqc-smollm2/model.safetensors \
            --output-dir /tmp/fqc-smollm2/structural-result
      - name: Upload structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smollm2-135m-structural-audit
          path: /tmp/fqc-smollm2/structural-result
          if-no-files-found: error
