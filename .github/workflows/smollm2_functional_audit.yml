name: smollm2-functional-audit

on:
  pull_request:
    paths:
      - 'src/fqc/functional_interventions.py'
      - 'scripts/run_smollm2_functional_audit.py'
      - 'tests/test_functional_interventions.py'
      - 'experiments/transformer/T001_smollm2_135m/functional_audit_contract.json'
      - '.github/workflows/smollm2_functional_audit.yml'
  workflow_dispatch:

jobs:
  functional-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FQC
        run: python -m pip install -e .
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'transformers==4.47.1' 'safetensors==0.4.5'
      - name: Download pinned SmolLM2 model files
        run: |
          mkdir -p /tmp/fqc-smollm2
          curl -L --fail --retry 3 \
            -o /tmp/fqc-smollm2/config.json \
            'https://huggingface.co/HuggingFaceTB/SmolLM2-135M/resolve/28e66ca6931668447a3bac213f23d990ad3b0e2b/config.json?download=true'
          curl -L --fail --retry 3 \
            -o /tmp/fqc-smollm2/model.safetensors \
            'https://huggingface.co/HuggingFaceTB/SmolLM2-135M/resolve/28e66ca6931668447a3bac213f23d990ad3b0e2b/model.safetensors?download=true'
      - name: Run task-conditioned functional interventions
        run: |
          python scripts/run_smollm2_functional_audit.py \
            --model-dir /tmp/fqc-smollm2 \
            --output-dir /tmp/fqc-smollm2/functional-result
      - name: Upload functional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smollm2-135m-functional-audit
          path: /tmp/fqc-smollm2/functional-result
          if-no-files-found: error
