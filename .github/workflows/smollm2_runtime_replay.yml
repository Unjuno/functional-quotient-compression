name: smollm2-runtime-replay

on:
  pull_request:
    paths:
      - 'src/fqc/hf_llama_adapter.py'
      - 'src/fqc/llama_runtime_replay.py'
      - 'src/fqc/replay.py'
      - 'scripts/run_smollm2_runtime_replay.py'
      - 'experiments/transformer/T001_smollm2_135m/runtime_replay_contract.json'
      - '.github/workflows/smollm2_runtime_replay.yml'
  workflow_dispatch:

jobs:
  runtime-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FQC
        run: python -m pip install -e .
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'transformers==4.47.1' 'safetensors==0.4.5'
      - name: Download pinned SmolLM2 files
        run: |
          mkdir -p /tmp/fqc-smollm2
          curl -L --fail --retry 3 \
            -o /tmp/fqc-smollm2/config.json \
            'https://huggingface.co/HuggingFaceTB/SmolLM2-135M/resolve/28e66ca6931668447a3bac213f23d990ad3b0e2b/config.json?download=true'
          curl -L --fail --retry 3 \
            -o /tmp/fqc-smollm2/model.safetensors \
            'https://huggingface.co/HuggingFaceTB/SmolLM2-135M/resolve/28e66ca6931668447a3bac213f23d990ad3b0e2b/model.safetensors?download=true'
      - name: Run runtime storage and layer-0 replay
        run: |
          python scripts/run_smollm2_runtime_replay.py \
            --model-dir /tmp/fqc-smollm2 \
            --output-dir /tmp/fqc-smollm2/runtime-result
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smollm2-135m-runtime-replay
          path: /tmp/fqc-smollm2/runtime-result
          if-no-files-found: error
