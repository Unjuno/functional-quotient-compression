name: smollm2-header-preflight

on:
  pull_request:
    paths:
      - 'src/fqc/safetensors_inventory.py'
      - 'src/fqc/hf_llama_adapter.py'
      - 'scripts/run_smollm2_header_preflight.py'
      - 'experiments/transformer/T001_smollm2_135m/**'
      - '.github/workflows/smollm2_header_preflight.yml'
  workflow_dispatch:

jobs:
  header-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FQC
        run: python -m pip install -e .
      - name: Download pinned SmolLM2 checkpoint
        run: |
          mkdir -p /tmp/fqc-smollm2
          curl -L --fail --retry 3 \
            -o /tmp/fqc-smollm2/model.safetensors \
            'https://huggingface.co/HuggingFaceTB/SmolLM2-135M/resolve/28e66ca6931668447a3bac213f23d990ad3b0e2b/model.safetensors?download=true'
      - name: Run serialized checkpoint preflight
        run: |
          python scripts/run_smollm2_header_preflight.py \
            --checkpoint /tmp/fqc-smollm2/model.safetensors \
            --output-dir /tmp/fqc-smollm2/result
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smollm2-135m-header-preflight
          path: /tmp/fqc-smollm2/result
          if-no-files-found: error
